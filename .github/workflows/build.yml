name: Build OpenEMS
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
      - develop
  
jobs:
  build-java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle

      - uses: kiancross/checkstyle-annotations-action@16cac2b2825757b1fd66d804d885ad41a8c5f393 # v1.0.0

      - name: Checkstyle
        run: ./gradlew checkstyleAll --console=colored --warn

      - name: Build all Java packages
        run: ./gradlew build --console=colored --warn

      - name: Upload Java test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: java-test-results
          path: '**/TEST-*.xml'
          if-no-files-found: ignore

      - name: Resolve OpenEMS bundles
        run: ./gradlew resolve --console=colored --warn

      - name: Validate OSGi resolution
        run: git diff --exit-code -- io.openems.backend.application/BackendApp.bndrun io.openems.edge.application/EdgeApp.bndrun

      - name: Generate JaCoCo Code-coverage-report
        run: ./gradlew jacocoLogAggregatedCoverage

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@0b35c9ecc4f0529d0eb674914510c22f85b196b4 # v7.1.0
        with:
          flags: java
          token: ${{ secrets.CODECOV_TOKEN }}

  build-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Setup Cache for Node.js
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.npm
            ~/.ng
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci --prefer-offline --cache ~/.npm

      - name: Configure Angular cache
        working-directory: ui
        run: node_modules/.bin/ng config cli.cache.path "~/.ng"

      - name: Lint OpenEMS UI
        working-directory: ui
        run: npm run lint

      - name: Build OpenEMS UI
        working-directory: ui
        run: node_modules/.bin/ng build -c "openems,openems-edge-prod,prod"

      - name: Test OpenEMS UI
        working-directory: ui
        env:
          CHROME_BIN: /usr/bin/google-chrome-stable
        run: npm run test -- --code-coverage --no-watch --no-progress --browsers=ChromeHeadlessCI

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@0b35c9ecc4f0529d0eb674914510c22f85b196b4 # v7.1.0
        with:
          flags: ui
          directory: ./ui/
          token: ${{ secrets.CODECOV_TOKEN }}
