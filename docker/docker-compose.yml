services:
  edge:
    image: ghcr.io/mummeenergie/openems-edge:${OPENEMS_VERSION:-latest}
    container_name: openems-edge
    hostname: edge
    restart: unless-stopped
    volumes:
      - ./edge/config:/var/opt/openems/config:rw
      - ./edge/data:/var/opt/openems/data:rw
    ports:
      - "502:502" # Modbus TCP
      - "8080:8080" # Apache Felix Web Console
      - "8075:8075" # UI WebSocket

  ui:
    image: ghcr.io/mummeenergie/openems-ui-edge:${OPENEMS_VERSION:-latest}
    container_name: openems-ui
    hostname: ui
    restart: unless-stopped
    environment:
      WEBSOCKET_HOST: edge
      WEBSOCKET_PORT: "8075"
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - edge
