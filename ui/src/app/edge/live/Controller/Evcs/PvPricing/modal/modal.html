<oe-modal [title]="this.component.alias" [component]="component" [formGroup]="formGroup" *ngIf="isInitialized">

  <oe-modal-line [name]="'General.currentPrice' | translate"
    [value]="currentPrice != null ? (currentPrice | number:'1.2-4') + ' €/kWh' : '-'">
  </oe-modal-line>

  <oe-modal-horizontal-line></oe-modal-horizontal-line>

  <oe-modal-line [name]="'Edge.Index.Widgets.EVCS.PvPricing.maxCeiling' | translate" [formGroup]="formGroup"
    controlName="maxCeiling" [control]="{type: 'INPUT'}">
  </oe-modal-line>

  <oe-modal-line [name]="'Edge.Index.Widgets.EVCS.PvPricing.minCeiling' | translate" [formGroup]="formGroup"
    controlName="minCeiling" [control]="{type: 'INPUT'}">
  </oe-modal-line>

  <oe-modal-line [name]="'Edge.Index.Widgets.EVCS.PvPricing.pvThreshold' | translate" [formGroup]="formGroup"
    controlName="pvThreshold" [control]="{type: 'INPUT'}">
  </oe-modal-line>

  <oe-modal-line [name]="'Edge.Index.Widgets.EVCS.PvPricing.pvFullProduction' | translate" [formGroup]="formGroup"
    controlName="pvFullProduction" [control]="{type: 'INPUT'}">
  </oe-modal-line>

  <oe-modal-line [name]="'Edge.Index.Widgets.EVCS.PvPricing.dataCollectionWindow' | translate" [formGroup]="formGroup"
    controlName="dataCollectionWindowMinutes" [control]="{type: 'INPUT'}">
  </oe-modal-line>

  <oe-modal-horizontal-line></oe-modal-horizontal-line>

  <oe-modal-info-line [info]="'Edge.Index.Widgets.EVCS.PvPricing.info' | translate">
  </oe-modal-info-line>

</oe-modal>
