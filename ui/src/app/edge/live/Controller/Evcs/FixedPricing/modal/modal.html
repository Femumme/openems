<oe-modal [title]="this.component.alias" [component]="component" [formGroup]="formGroup" *ngIf="isInitialized">

  <oe-modal-line [name]="'General.currentPrice' | translate"
    [value]="currentPrice != null ? (currentPrice | number:'1.2-4') + ' €/kWh' : '-'">
  </oe-modal-line>

  <oe-modal-horizontal-line></oe-modal-horizontal-line>

  <oe-modal-line [name]="'Edge.Index.Widgets.EVCS.FixedPricing.price' | translate" [formGroup]="formGroup"
    controlName="priceEurPerKwh" [control]="{type: 'INPUT'}">
  </oe-modal-line>

  <oe-modal-horizontal-line></oe-modal-horizontal-line>

  <oe-modal-info-line [info]="'Edge.Index.Widgets.EVCS.FixedPricing.info' | translate">
  </oe-modal-info-line>

</oe-modal>
